name: Simulado (backtest)

on:
  workflow_dispatch:   # só roda quando você clicar em "Run workflow"

permissions:
  contents: write

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Rodar o simulado
        run: python3 backtest.py

      - name: Salvar o resultado
        run: |
          git config user.name "robo-mesa-do-dia"
          git config user.email "actions@users.noreply.github.com"
          git add backtest_resultado.json backtest_relatorio.md
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Resultado do simulado"
            git push
          fi
